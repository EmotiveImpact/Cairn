name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and safety checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          swift --version

      - name: Build
        run: swift build -c debug

      # Disposable-fixture suites only. None of these touch personal data.
      - name: Safety check
        run: |
          "$(swift build --show-bin-path)/Cairn" --safetycheck

      - name: Workspace check
        run: |
          "$(swift build --show-bin-path)/Cairn" --workspacecheck

      # A picture of the Make room page with sample data, to compare with the mock.
      - name: Make room screenshot
        continue-on-error: true
        timeout-minutes: 2
        run: |
          "$(swift build --show-bin-path)/Cairn" --preview-ui --component-showcase --capture-screen=makeRoom --section=makeRoom
          # Also print it into the log, so it can be read where artifact downloads are blocked.
          if [ -f artifacts/component-showcase/makeRoom.png ]; then
            sips -s format jpeg -s formatOptions 80 artifacts/component-showcase/makeRoom.png --out "$RUNNER_TEMP/makeRoom.jpg" >/dev/null
            echo "SHOT-BEGIN"; base64 -i "$RUNNER_TEMP/makeRoom.jpg" | tr -d '\n'; echo; echo "SHOT-END"
          fi

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/component-showcase/
          if-no-files-found: ignore

      - name: Evidence check
        run: |
          "$(swift build --show-bin-path)/Cairn" --evidencecheck

      - name: CLI refusal check
        run: |
          sh Support/Checks/cli-clean-refusal.sh "$(swift build --show-bin-path)/Cairn"
