name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and safety checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          swift --version

      - name: Packaging failure checks (no signing or submission)
        run: |
          bash -n build_local.sh build_release.sh
          python3 Support/Checks/packaging-check.py

      - name: Build
        run: swift build -c debug -j 2

      # Disposable-fixture suites only. None of these touch personal data.
      - name: Safety check
        run: |
          "$(swift build --show-bin-path)/Cairn" --safetycheck

      - name: Workspace check
        run: |
          "$(swift build --show-bin-path)/Cairn" --workspacecheck

      # A picture of the Make room page with sample data, to compare with the mock.
      - name: Make room screenshot
        continue-on-error: true
        timeout-minutes: 2
        run: |
          "$(swift build --show-bin-path)/Cairn" --preview-ui --component-showcase --capture-screen=makeRoom --section=makeRoom
          # Also print it into the log, so it can be read where artifact downloads are blocked.
          if [ -f artifacts/component-showcase/makeRoom.png ]; then
            sips -s format jpeg -s formatOptions 80 artifacts/component-showcase/makeRoom.png --out "$RUNNER_TEMP/makeRoom.jpg" >/dev/null
            echo "SHOT-BEGIN"; base64 -i "$RUNNER_TEMP/makeRoom.jpg" | tr -d '\n'; echo; echo "SHOT-END"
          fi

      # The newer pages with sample data, in Dark and two in Light, to compare with the mocks.
      # Printed into the log only and moved out of the upload folder, so they add no artifact storage.
      - name: New pages screenshots
        continue-on-error: true
        timeout-minutes: 4
        run: |
          bin="$(swift build --show-bin-path)/Cairn"
          for shot in target chatApps games duplicates apps appleIntelligence target:light games:light appleIntelligence:light; do
            section="${shot%%:*}"; extra=""; name="$section"
            if [ "$shot" != "$section" ]; then extra="--capture-light"; name="$section-light"; fi
            "$bin" --preview-ui --component-showcase --capture-screen="$section" --section="$section" $extra || true
            if [ -f "artifacts/component-showcase/$name.png" ]; then
              sips -s format jpeg -s formatOptions 70 "artifacts/component-showcase/$name.png" --out "$RUNNER_TEMP/$name.jpg" >/dev/null
              echo "SHOT-BEGIN $name"; base64 -i "$RUNNER_TEMP/$name.jpg" | tr -d '\n'; echo; echo "SHOT-END"
              mv "artifacts/component-showcase/$name.png" "$RUNNER_TEMP/"
            fi
          done

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/component-showcase/
          if-no-files-found: ignore

      - name: Evidence check
        run: |
          "$(swift build --show-bin-path)/Cairn" --evidencecheck

      - name: Reliability regressions
        run: |
          "$(swift build --show-bin-path)/Cairn" --reliabilitycheck

      - name: Scan lifecycle and crash recovery
        timeout-minutes: 8
        run: |
          "$(swift build --show-bin-path)/Cairn" --lifecyclecheck

      - name: CLI refusal check
        run: |
          sh Support/Checks/cli-clean-refusal.sh "$(swift build --show-bin-path)/Cairn"

      - name: Universal optimized build and reliability regressions
        run: |
          swift build -c release -j 2 --arch arm64 --arch x86_64
          lipo .build/apple/Products/Release/Cairn -verify_arch arm64 x86_64
          .build/apple/Products/Release/Cairn --reliabilitycheck

      # A ready-made copy for read-only checks on a Mac with little free space,
      # so nothing has to be compiled there. Not signed or notarised; kept 3 days.
      # Packed with tar because artifact uploads drop the execute permission;
      # unpack with `tar -xzf cairn-test-copy.tar.gz` and run ./Cairn.
      - name: Pack test copy of the command line
        continue-on-error: true
        run: tar -czf cairn-test-copy.tar.gz -C .build/apple/Products/Release Cairn

      - name: Upload test copy of the command line
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cairn-test-copy
          path: cairn-test-copy.tar.gz
          retention-days: 3
          if-no-files-found: ignore

      # The full app from the same build, so it can be opened on a Mac that has
      # no room to compile. Signed only with a local (ad-hoc) signature, not
      # Developer ID and not notarised, so Full Disk Access must be granted to
      # it separately. Kept 3 days. Unpack with `tar -xzf cairn-app.tar.gz`.
      - name: Pack test copy of the app
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/app" && mkdir -p "$RUNNER_TEMP/app"
          APP="$RUNNER_TEMP/app/Cairn.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/apple/Products/Release/Cairn "$APP/Contents/MacOS/Cairn"
          cp Cairn/Info.plist "$APP/Contents/Info.plist"
          [ -d .build/apple/Products/Release/Cairn_Cairn.bundle ] && cp -R .build/apple/Products/Release/Cairn_Cairn.bundle "$APP/Contents/Resources/"
          cp Cairn/Resources/Cairn.icns Cairn/Resources/CairnMark.png "$APP/Contents/Resources/"
          for f in hero.png SampleCoastFilm.png; do [ -f "Cairn/Resources/$f" ] && cp "Cairn/Resources/$f" "$APP/Contents/Resources/"; done
          for m in Cairn/Resources/logo-*.svg; do [ -f "$m" ] && cp "$m" "$APP/Contents/Resources/"; done
          codesign --force --sign - "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          tar -czf cairn-app.tar.gz -C "$RUNNER_TEMP/app" Cairn.app

      - name: Upload test copy of the app
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cairn-app
          path: cairn-app.tar.gz
          retention-days: 3
          if-no-files-found: ignore
