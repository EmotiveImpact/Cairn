[project]
name = "macsweep"
version = "0.1.0"
description = "Mac cleanup tool — finds old installers, caches, orphaned data, and other junk for review"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
macsweep = "macsweep.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["macsweep*"]
